name: galeria
description: Galería privada para el equipo de Vidrios VECA.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  crypto: ^3.0.8
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/vivienda-720.webp
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/manrope.ttf
